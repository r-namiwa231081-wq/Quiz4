    const generateMathQuestion = (grade) => {
      let q = ""; let correct = 0;
      const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
      if (grade === 'g1_2') {
        const type = rand(1, 3);
        if (type === 1) { const a = rand(1, 20); const b = rand(1, 20); q = `${a} + ${b} = ?`; correct = a + b; } 
        else if (type === 2) { const a = rand(10, 30); const b = rand(1, a); q = `${a} - ${b} = ?`; correct = a - b; } 
        else { const a = rand(1, 9); const b = rand(1, 9); q = `${a} × ${b} = ?`; correct = a * b; }
      } else if (grade === 'g3') {
        const type = rand(1, 3);
        if (type === 1) { const a = rand(10, 99); const b = rand(10, 99); q = `${a} + ${b} = ?`; correct = a + b; } 
        else if (type === 2) { const a = rand(20, 99); const b = rand(10, a); q = `${a} - ${b} = ?`; correct = a - b; } 
        else { const a = rand(10, 99); const b = rand(2, 9); q = `${a} × ${b} = ?`; correct = a * b; }
      } else if (grade === 'g4') {
        const type = rand(1, 3);
        if (type === 1) { const a = rand(100, 999); const b = rand(100, 999); q = `${a} + ${b} = ?`; correct = a + b; } 
        else if (type === 2) { const a = rand(100, 999); const b = rand(10, a); q = `${a} - ${b} = ?`; correct = a - b; } 
        else { const b = rand(2, 9); const ans = rand(11, 50); const a = b * ans; q = `${a} ÷ ${b} = ?`; correct = ans; }
      } else {
        const type = rand(1, 3);
        if (type === 1) { const a = (rand(1, 99) / 10).toFixed(1); const b = (rand(1, 99) / 10).toFixed(1); q = `${a} + ${b} = ?`; correct = (parseFloat(a) + parseFloat(b)).toFixed(1); } 
        else if (type === 2) { const a = (rand(11, 99) / 10).toFixed(1); const b = (rand(1, 10) / 10).toFixed(1); q = `${a} - ${b} = ?`; correct = (parseFloat(a) - parseFloat(b)).toFixed(1); } 
        else { const a = rand(11, 50); const b = rand(2, 9); q = `${a} × ${b} = ?`; correct = a * b; }
      }

      const isFloat = typeof correct === 'string' && correct.includes('.');
      const cNum = isFloat ? parseFloat(correct) : correct;
      let dummies = new Set();
      while(dummies.size < 3) {
        let dummy;
        if (isFloat) { let diff = (rand(1, 20) / 10) * (rand(0, 1) === 0 ? 1 : -1); if (diff === 0) diff = 1.0; dummy = (cNum + diff).toFixed(1); } 
        else { let diff = rand(1, 10) * (rand(0, 1) === 0 ? 1 : -1); if (diff === 0) diff = 1; dummy = cNum + diff; }
        if (dummy != correct && dummy > 0) dummies.add(String(dummy));
      }
      const dummyArr = Array.from(dummies);
      return { q, correct: String(correct), w1: dummyArr[0], w2: dummyArr[1], w3: dummyArr[2], subject: 'sansu', grade: grade };
    };

    const AI_THEMES = ["日常の発見", "動物・生き物", "宇宙・科学", "スポーツ", "歴史・冒険", "食べ物", "生活の工夫", "世界の国々", "言葉あそび"];

    const generateQuestionWithAI = async (subjectName, gradeName, historyList = [], isChallenge = false) => {
      if (!geminiApiKey) return null;

      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`;
      const historyStr = historyList.slice(-10).join(', ');
      const randomTheme = AI_THEMES[Math.floor(Math.random() * AI_THEMES.length)];
      const randomSeed = Math.floor(Math.random() * 1000000);

      let prompt = `あなたは日本の${gradeName}向けの「${subjectName}」の先生です。
ランダムシード: ${randomSeed}
テーマ: 「${randomTheme}」
以下の条件で、選択肢4つの学習クイズを1問だけ作成し、指定のJSONフォーマットでのみ出力してください。
- 他の教科の知識を絶対に混ぜないでください。${subjectName}の範囲に限定してください。
- 以下の過去の出題とは被らないでください: [${historyStr}]
- 解答形式は必ず次のJSON文字列のみにしてください。挨拶文や\`\`\`jsonなどの装飾は厳禁です。
{"q":"問題文","correct":"正解","w1":"間違い1","w2":"間違い2","w3":"間違い3"}`;

      if (isChallenge) {
        prompt = `あなたはクイズマスターです。小学生レベルを超えた「超難問」を1問作成してください。
ランダムシード: ${randomSeed}
テーマ: 「${randomTheme}」
以下の過去の出題とは被らない内容にしてください: [${historyStr}]
解答形式は必ず次のJSON文字列のみにしてください。
{"q":"問題文","correct":"正解","w1":"間違い1","w2":"間違い2","w3":"間違い3"}`;
      }

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.95 } })
        });
        
        if (!response.ok) return null;

        const result = await response.json();
        if (result.candidates && result.candidates.length > 0) {
          const rawText = result.candidates[0].content.parts[0].text;
          const jsonMatch = rawText.match(/\{[\s\S]*?\}/);
          if (jsonMatch) {
            const parsed = JSON.parse(jsonMatch[0]);
            if (parsed.q && parsed.correct && parsed.w1 && parsed.w2 && parsed.w3) {
              return parsed;
            }
          }
        }
      } catch (error) {
        console.error("AI Generation Warning:", error);
      }
      return null;
    };

    const getLevelData = (totalExp = 0) => {
      let level = 1; let expForNext = 50; let currentBase = 0;
      while (totalExp >= currentBase + expForNext) { currentBase += expForNext; level++; expForNext = Math.floor(expForNext * 1.5); }
      return { level, expInCurrentLevel: totalExp - currentBase, expForNext, maxHp: 50 + (level - 1) * 20, maxMp: 30 + (level - 1) * 10, baseDamage: 10 + (level - 1) * 5 };

            <div className="animate-spin text-5xl mb-4">⚔️</div>
            <div>ロード中...</div>
          </div>
        );
      }

      if (view === 'title') return <TitleScreen profile={profile} onStart={() => profile ? setView('map') : setView('create')} onTeacher={() => setView('teacher')} onTransfer={handleTransfer} dbReady={!!db} aiReady={!!geminiApiKey} />;
      if (view === 'create') return <CreateScreen onSubmit={handleCreateProfile} onBack={profile ? () => setView('title') : null} />;
      if (view === 'teacher') return <TeacherScreen customQuestions={customQuestions} saveCustomQuestions={saveCustomQuestions} onBack={() => setView('title')} />;
      if (view === 'shop' && profile) return <ShopScreen profile={profile} saveProfile={saveProfile} onBack={() => setView('map')} />;
      if (view === 'battle' && battleParams && profile) return <BattleScreen profile={profile} saveProfile={saveProfile} params={battleParams} allQuestions={[...BUILT_IN_QUESTIONS, ...customQuestions]} onEnd={() => setView('map')} />;
      if (view === 'map' && profile) return <MapScreen profile={profile} onSelectBattle={(params) => { setBattleParams(params); setView('battle'); }} onShop={() => setView('shop')} onBack={() => setView('title')} saveProfile={saveProfile} />;
      
      return <CreateScreen onSubmit={handleCreateProfile} onBack={null} />;
    }

          saveProfile({
            ...profile,
            coins: profile.coins - item.price,
            ownedItems: [...(profile.ownedItems || []), item.id]
          });
        }
      };

      const handleEquip = (itemId, type) => {
        saveProfile({
          ...profile,
          equipped: { ...(profile.equipped || {}), [type]: itemId }
        });
      };

      const handleGacha = () => {
        const cost = 500;
        if ((profile.coins || 0) < cost) return;

        const pool = [
          ...ITEMS.head.filter(i => i.id !== 'h_none'),
          ...ITEMS.body.filter(i => i.id !== 'b_none'),
          ...ITEMS.weapon.filter(i => i.id !== 'w_none'),
          ...PETS.filter(p => p.id !== 'p_none').map(p => ({ ...p, isPet: true }))
        ];
        
        const item = pool[Math.floor(Math.random() * pool.length)];
        let newProfile = { ...profile, coins: profile.coins - cost };
        
        if (item.isPet) {
          if (!newProfile.ownedPets) newProfile.ownedPets = ['p_none'];
          if (!newProfile.ownedPets.includes(item.id)) newProfile.ownedPets.push(item.id);
        } else {
          if (!newProfile.ownedItems) newProfile.ownedItems = [];
          if (!newProfile.ownedItems.includes(item.id)) newProfile.ownedItems.push(item.id);
        }

        setGachaResult(item);
        saveProfile(newProfile);
        setTimeout(() => setGachaResult(null), 3000);
      };

      const headItem = safeGetEquippedItem(profile, 'head');
      const bodyItem = safeGetEquippedItem(profile, 'body');
      const weaponItem = safeGetEquippedItem(profile, 'weapon');
      const petItem = safeGetEquippedPet(profile);

      return (
        <div className="min-h-screen bg-orange-50 p-4 font-sans pb-24 relative overflow-hidden">

    function BattleScreen({ profile, saveProfile, params, allQuestions, onEnd }) {
      const levelData = useMemo(() => getLevelData(profile?.exp || 0), [profile]);
      
      const headItem = safeGetEquippedItem(profile, 'head');
      const bodyItem = safeGetEquippedItem(profile, 'body');
      const weaponItem = safeGetEquippedItem(profile, 'weapon');
      const petItem = safeGetEquippedPet(profile);

      const totalMaxHp = levelData.maxHp + headItem.bonus;
      const totalMaxMp = levelData.maxMp + petItem.bonus;
      const totalBaseDamage = levelData.baseDamage + weaponItem.bonus;

      const [phase, setPhase] = useState('intro');
      const [enemy, setEnemy] = useState(null);
      const [playerHp, setPlayerHp] = useState(totalMaxHp);
      const [enemyHp, setEnemyHp] = useState(0);
      
      const [currentQ, setCurrentQ] = useState(null);
      const [options, setOptions] = useState([]);
      const [askedQuestions, setAskedQuestions] = useState([]);

      const fetchSingleQuestion = async (history) => {
        const isChallenge = params.subject === 'challenge';
        const subjectObj = SUBJECTS.find(s => s.id === params.subject) || SUBJECTS[0];
        const gradeObj = GRADES.find(g => g.id === params.grade.id) || GRADES[0];

        if (geminiApiKey) {
          const aiRes = await generateQuestionWithAI(subjectObj.name, gradeObj.name, history, isChallenge);
          if (aiRes) return { ...aiRes, subject: params.subject, grade: params.grade.id };
        }

        if (params.subject === 'sansu' && !isChallenge) return generateMathQuestion(params.grade.id);

        const pool = BUILT_IN_QUESTIONS.filter(q => q.subject === params.subject);
        return pool[Math.floor(Math.random() * pool.length)] || generateMathQuestion(params.grade.id);
      };

      useEffect(() => {
        const enemyBase = MONSTERS[Math.floor(Math.random() * MONSTERS.length)];
        setEnemy(enemyBase);
        setEnemyHp(enemyBase.hp);

        const initQuestions = async () => {
          const firstQ = await fetchSingleQuestion([]);
          setCurrentQ(firstQ);
          setAskedQuestions([firstQ.q]);
          setupQuestionOptions(firstQ);
          setPhase('question');
        };

        setTimeout(() => initQuestions(), 1500);
      }, []);

      const setupQuestionOptions = (q) => {
        const opts = shuffleArray([
          { text: q.correct, isCorrect: true },
          { text: q.w1, isCorrect: false },
          { text: q.w2, isCorrect: false },
          { text: q.w3, isCorrect: false },
        ]);
        setOptions(opts);
      };

      const handleAnswer = (opt) => {
        if (opt.isCorrect) {
          const dmg = totalBaseDamage + 10;
          const newHp = Math.max(0, enemyHp - dmg);
          setEnemyHp(newHp);
          if (newHp <= 0) {
            setPhase('clear');
            saveProfile({ ...profile, exp: (profile.exp || 0) + 20, coins: (profile.coins || 0) + 15 });
          } else {
            fetchSingleQuestion(askedQuestions).then(nextQ => {
              setCurrentQ(nextQ);
              setupQuestionOptions(nextQ);
            });
          }
        } else {
          setPlayerHp(prev => Math.max(0, prev - 10));
        }
      };

      if (phase === 'intro') {
        return (
          <div className="fixed inset-0 bg-black flex flex-col items-center justify-center text-white">
            <h2 className="text-4xl font-black text-red-500 mb-2">バトル開始！</h2>
          </div>
        );
      }

      return (
        <div className="fixed inset-0 bg-gray-900 text-white flex flex-col justify-between p-4">
          <div className="flex flex-col items-center">
            <div className="text-xl font-bold">{enemy?.name} (HP: {enemyHp})</div>
            <img src={enemy?.img} className="w-40 h-40 object-contain my-4" />
          </div>

          <div className="bg-white text-gray-900 rounded-3xl p-6 shadow-xl">
            {phase === 'question' && currentQ && (
              <div>
                <h3 className="text-xl font-black mb-4 text-center">{currentQ.q}</h3>
                <div className="grid grid-cols-2 gap-3">
                  {options.map((opt, i) => (
                    <button key={i} onClick={() => handleAnswer(opt)} className="bg-gray-100 p-4 rounded-xl font-bold hover:bg-blue-100">{opt.text}</button>
                  ))}
                </div>
              </div>
            )}
            {phase === 'clear' && (
              <div className="text-center">
                <h2 className="text-3xl font-black text-yellow-500 mb-4">勝利！</h2>
                <button onClick={onEnd} className="bg-yellow-500 text-white font-black px-6 py-3 rounded-xl">マップへ</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
